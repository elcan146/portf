<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 \\ Signal Lost</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#020206" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'StarWarsCrawl';
        src: url('/font/text.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        height: 100%;
        background: #020206;
        color: #fff;
        font-family: 'Space Mono', monospace;
        overflow: hidden;
      }

      /* White flash that swallows the page-in — same beat as the
         site's hyperspace jump. */
      #warp {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #fff;
        pointer-events: none;
        animation: warp-out 0.55s ease-out 0.05s forwards;
      }
      @keyframes warp-out {
        to { opacity: 0; }
      }

      /* --- Twinkling starfield (pure CSS, two drifting layers) --- */
      .stars, .stars::before, .stars::after {
        position: fixed;
        inset: -50%;
        content: "";
        background-repeat: repeat;
        pointer-events: none;
      }
      .stars::before {
        background-image:
          radial-gradient(1.5px 1.5px at 22px 34px, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 130px 80px, #a2c8ff 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 320px 190px, #7ee7ff 50%, transparent 51%),
          radial-gradient(1px 1px at 60px 220px, #ffecc9 50%, transparent 51%),
          radial-gradient(1.6px 1.6px at 240px 120px, #e6f1ff 50%, transparent 51%);
        background-size: 380px 380px;
        animation: drift 140s linear infinite;
      }
      .stars::after {
        background-image:
          radial-gradient(1px 1px at 50px 160px, #fff 50%, transparent 51%),
          radial-gradient(2px 2px at 200px 40px, #e7b8ff 50%, transparent 51%),
          radial-gradient(1px 1px at 300px 300px, #a2c8ff 50%, transparent 51%),
          radial-gradient(1.3px 1.3px at 100px 320px, #ffcca3 50%, transparent 51%);
        background-size: 520px 520px;
        animation: drift 220s linear infinite reverse;
        opacity: 0.7;
      }
      @keyframes drift {
        to { transform: translate3d(120px, 260px, 0); }
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        position: relative;
        width: min(520px, 100%);
        text-align: center;
        padding: 40px 28px 32px;
        background: rgba(2, 8, 16, 0.6);
        border: 1px solid rgba(75, 242, 255, 0.28);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        /* card-in runs once on load (born overexposed, cools to glass),
           card-breathe keeps the halo pulsing forever after. */
        animation:
          card-in 0.75s cubic-bezier(0.2, 0.9, 0.3, 1) 0.1s both,
          card-breathe 3.4s ease-in-out 0.85s infinite;
      }
      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(34px) scale(0.96);
          filter: brightness(4.5) drop-shadow(0 0 60px rgba(255, 255, 255, 0.9));
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      @keyframes card-breathe {
        0%, 100% {
          box-shadow:
            0 0 10px rgba(75, 242, 255, 0.12),
            inset 0 0 12px rgba(75, 242, 255, 0.05);
        }
        50% {
          box-shadow:
            0 0 22px rgba(75, 242, 255, 0.24),
            inset 0 0 18px rgba(75, 242, 255, 0.09);
        }
      }
      /* Corner brackets — same language as the contact link cards */
      .card::before, .card::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
      }
      .card::before {
        top: -1px; left: -1px;
        border-top: 2px solid rgba(75, 242, 255, 0.9);
        border-left: 2px solid rgba(75, 242, 255, 0.9);
      }
      .card::after {
        bottom: -1px; right: -1px;
        border-bottom: 2px solid rgba(75, 242, 255, 0.9);
        border-right: 2px solid rgba(75, 242, 255, 0.9);
      }

      /* Inner elements cascade in behind the card landing */
      .rise {
        animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .sys {
        font-size: 9px;
        letter-spacing: 0.3em;
        color: rgba(150, 205, 255, 0.55);
      }

      .code {
        margin-top: 18px;
        font-family: 'StarWarsCrawl', 'Space Grotesk', sans-serif;
        font-size: clamp(72px, 20vw, 120px);
        line-height: 1;
        letter-spacing: 6px;
        color: #ffdf40;
        text-shadow: 0 0 34px rgba(255, 223, 64, 0.5);
      }

      .title {
        margin-top: 10px;
        font-family: 'StarWarsCrawl', 'Space Grotesk', sans-serif;
        font-size: clamp(20px, 5vw, 30px);
        letter-spacing: 4px;
        text-transform: uppercase;
        color: rgba(140, 220, 255, 0.95);
        text-shadow: 0 0 14px rgba(75, 242, 255, 0.4);
      }

      .divider {
        position: relative;
        height: 1px;
        margin: 22px 0;
        background: rgba(140, 200, 255, 0.28);
        overflow: hidden;
      }
      .divider span {
        position: absolute;
        top: 0; left: -22%;
        width: 22%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(170, 230, 255, 0.95), transparent);
        animation: scanx 3.4s linear infinite;
      }
      @keyframes scanx { to { left: 100%; } }

      .msg {
        font-size: 12.5px;
        letter-spacing: 0.05em;
        line-height: 1.8;
        color: rgba(230, 241, 255, 0.85);
      }
      .msg .bad-path { color: #ffdf40; }

      .count {
        margin-top: 22px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: rgba(140, 220, 255, 0.9);
      }
      .count b {
        color: #fff;
        font-size: 15px;
      }

      /* Redirect progress bar */
      .bar {
        margin-top: 12px;
        height: 3px;
        background: rgba(75, 242, 255, 0.15);
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 100%;
        background: #4bf2ff;
        box-shadow: 0 0 10px #4bf2ff;
        transform-origin: left center;
        animation: drain 5s linear forwards;
      }
      @keyframes drain { to { transform: scaleX(0); } }

      .jump {
        display: inline-block;
        margin-top: 26px;
        padding: 10px 18px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-decoration: none;
        color: #a8d4ff;
        border: 1px solid rgba(140, 200, 255, 0.4);
        background:
          linear-gradient(90deg, rgba(80, 160, 255, 0.16) 90%, rgba(140, 220, 255, 0.42) 100%) left / 0% 100% no-repeat,
          rgba(3, 18, 70, 0.35);
        transition: background-size 0.35s cubic-bezier(0.2, 0.9, 0.3, 1), border-color 0.25s ease, color 0.2s;
      }
      .jump:hover, .jump:focus-visible {
        background-size: 100% 100%, auto;
        border-color: rgba(160, 220, 255, 0.9);
        color: #fff;
        outline: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #warp { display: none; }
        .card, .rise, .bar span, .stars::before, .stars::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars"></div>
    <div id="warp"></div>

    <main class="card">
      <div class="sys rise" style="animation-delay: 0.45s">&#9701; ELCAN.SYS &middot; NAV TERMINAL &middot; V2.7</div>
      <h1 class="code rise" style="animation-delay: 0.55s"><span data-scramble>404</span></h1>
      <h2 class="title rise" style="animation-delay: 0.65s"><span data-scramble>SIGNAL LOST</span></h2>
      <div class="divider rise" style="animation-delay: 0.75s"><span></span></div>
      <p class="msg rise" style="animation-delay: 0.85s">
        Oops — <span class="bad-path" id="bad-path" data-scramble>this sector</span> isn't on the nav chart.<br />
        Rerouting you back to home base.
      </p>
      <p class="count rise" style="animation-delay: 0.95s">REDIRECT IN <b id="count">5</b></p>
      <div class="bar rise" style="animation-delay: 1s"><span></span></div>
      <a class="jump rise" style="animation-delay: 1.1s" id="jump" href="/"><span data-scramble>JUMP NOW &#8250;</span></a>
    </main>

    <noscript>
      <meta http-equiv="refresh" content="6;url=/" />
    </noscript>

    <script>
      // Same mobile+tablet detection as index.html — tablets land on
      // /m/, desktops (and remembered ?desktop=1 opt-outs) on /.
      (function () {
        var target = "/";
        try {
          var host = location.hostname.toLowerCase();
          var desktop =
            localStorage.getItem("viewMode") === "desktop" ||
            /(^|;\s*)viewMode=desktop/.test(document.cookie);
          if (host.indexOf("m.") === 0) {
            target = "/"; // m.<domain> root already serves the mobile layout
          } else if (!desktop) {
            var ua = navigator.userAgent;
            var mobile =
              /iPhone|iPod|iPad|Windows Phone|BlackBerry|Opera Mini|IEMobile|Mobile.*Firefox|Android|PlayBook|Silk|Kindle/i.test(ua) ||
              (navigator.userAgentData && navigator.userAgentData.mobile === true) ||
              (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
            if (!mobile && window.matchMedia("(pointer: coarse)").matches) {
              mobile = Math.min(screen.width, screen.height) < 800;
            }
            target = mobile ? "/m/" : "/";
          }
        } catch (e) {}

        document.getElementById("jump").href = target;
        var bad = location.pathname;
        if (bad && bad !== "/") {
          document.getElementById("bad-path").textContent = bad;
        }

        // Scramble decode — same effect as the site's contact card:
        // random glyphs resolve left-to-right into the real text.
        var CHARS = "!<>-_\\/[]{}—=+*^?#";
        var reduceMotion = false;
        try {
          reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {}
        function scrambleEl(el) {
          var final = el.textContent;
          var len = final.length;
          var frame = 0;
          var total = 12 + len * 1.4;
          var iv = setInterval(function () {
            frame++;
            var reveal = (frame / total) * len * 1.35;
            var out = "";
            for (var i = 0; i < len; i++) {
              out += i < reveal
                ? final[i]
                : final[i] === " "
                  ? " "
                  : CHARS[(Math.random() * CHARS.length) | 0];
            }
            el.textContent = out;
            if (reveal >= len) {
              el.textContent = final;
              clearInterval(iv);
            }
          }, 28);
        }
        if (!reduceMotion) {
          var scr = document.querySelectorAll("[data-scramble]");
          for (var s = 0; s < scr.length; s++) {
            (function (el, i) {
              setTimeout(function () { scrambleEl(el); }, 400 + i * 140);
            })(scr[s], s);
          }
        }

        var left = 5;
        var countEl = document.getElementById("count");
        var timer = setInterval(function () {
          left--;
          if (left <= 0) {
            clearInterval(timer);
            location.replace(target);
          } else {
            countEl.textContent = left;
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
